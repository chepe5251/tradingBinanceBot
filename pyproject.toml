[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-binance-bot"
version = "0.1.0"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
include = ["bot*"]

[tool.pytest.ini_options]
# src layout: add src/ to sys.path so `import bot` resolves without installation.
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = [
    "unit: pure-logic tests with no network or filesystem I/O",
    "integration: tests that wire multiple real components together",
]
addopts = "--tb=short"
filterwarnings = [
    # python-binance 1.0.34 imports websockets.legacy / WebSocketClientProtocol
    # which are deprecated in websockets 14+. Suppress these known third-party warnings.
    "ignore::DeprecationWarning:websockets",
    "ignore::DeprecationWarning:binance",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "tests/*",
    ".venv/*",
    "backtest/*",
    "setup.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E: pycodestyle errors, F: pyflakes, I: isort, W: warnings
select = ["E", "F", "I", "W"]
ignore = [
    "E501",   # line too long (handled by formatter)
    "F841",   # local variable assigned but never used (trade_state pattern)
]
